services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ep_leads}
      POSTGRES_USER: ${POSTGRES_USER:-ep_leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ep_leads}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ep_leads}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ep_leads}:${POSTGRES_PASSWORD:-ep_leads}@postgres:5432/${POSTGRES_DB:-ep_leads}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-ep_leads}:${POSTGRES_PASSWORD:-ep_leads}@postgres:5432/${POSTGRES_DB:-ep_leads}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - documents:/data/documents
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ep_leads}:${POSTGRES_PASSWORD:-ep_leads}@postgres:5432/${POSTGRES_DB:-ep_leads}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-ep_leads}:${POSTGRES_PASSWORD:-ep_leads}@postgres:5432/${POSTGRES_DB:-ep_leads}
    depends_on:
      - backend
    volumes:
      - documents:/data/documents
    # --pool=threads (not the default prefork/fork) because each task opens its own
    # asyncpg connection via asyncio.run() - asyncpg connections are not fork-safe,
    # so forked worker processes sharing a pre-fork engine can deadlock/error.
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=threads --concurrency=4

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ep_leads}:${POSTGRES_PASSWORD:-ep_leads}@postgres:5432/${POSTGRES_DB:-ep_leads}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-ep_leads}:${POSTGRES_PASSWORD:-ep_leads}@postgres:5432/${POSTGRES_DB:-ep_leads}
    depends_on:
      - backend
    command: celery -A app.workers.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  documents:
